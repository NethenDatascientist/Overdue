<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minor Irrigation — Overdue Works Dashboard</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

  <!-- Plotly.js, SheetJS (XLSX) & LZ-String Compression -->
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>

  <style>
    :root {
      color-scheme: light !important;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Apply 90% Zoom ONLY to Dashboard (So Video Stays 100% Fullscreen) */
    @media (min-width: 1024px) {
      .app-layout {
        zoom: 90%;
      }
    }

    body {
      background: linear-gradient(180deg, #DCE4EE 0%, #E2E8F0 50%, #CBD5E1 100%);
      background-attachment: fixed;
      color: #0F172A;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =========================================================================
       1. TRUE EDGE-TO-EDGE FULLSCREEN INTRO VIDEO OVERLAY
       ========================================================================= */
    #intro-video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999999;
      background: #0F172A;
      overflow: hidden;
      transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.55s ease;
    }
    #intro-video-overlay.hidden-overlay {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #intro-video-player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
    }
    .intro-hud-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.84);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.38);
      padding: 9px 18px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      z-index: 10;
    }
    .intro-load-status {
      font-size: 0.82rem;
      font-weight: 700;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .intro-spinner {
      width: 14px;
      height: 14px;
      border: 2.5px solid #93C5FD;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    .intro-spinner.done {
      border: none;
      width: auto;
      height: auto;
      animation: none;
      color: #4ADE80;
      font-weight: 800;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .intro-btn {
      background: linear-gradient(180deg, #2563EB 0%, #1D4ED8 100%);
      color: #FFFFFF;
      border: 1px solid #60A5FA;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .intro-btn:hover {
      background: #1E40AF;
      transform: translateY(-1px);
    }

    /* =========================================================================
       2. APP SHELL LAYOUT (SIDEBAR + MAIN CONTENT)
       ========================================================================= */
    .app-layout {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Tinted Slate-Blue Sidebar (220px) */
    .sidebar {
      width: 220px;
      min-width: 220px;
      max-width: 220px;
      background: linear-gradient(180deg, #CFD9E6 0%, #DAE2ED 100%);
      border-right: 1px solid #94A3B8;
      padding: 1rem 0.7rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      transition: margin-left 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 100;
    }
    .sidebar.collapsed {
      margin-left: -220px;
    }
    .sidebar-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #0F172A;
      padding-bottom: 0.45rem;
      border-bottom: 1px solid #94A3B8;
    }
    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: #0F172A;
    }
    .ctrl-input {
      width: 100%;
      padding: 6px 8px;
      border-radius: 7px;
      border: 1px solid #64748B;
      background: #F1F5F9;
      color: #0F172A;
      font-size: 0.76rem;
      font-weight: 600;
    }
    .radio-stack, .check-stack {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.76rem;
      font-weight: 600;
      color: #1E293B;
    }
    .radio-stack label, .check-stack label {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      cursor: pointer;
      line-height: 1.3;
    }

    /* Sidebar Toggle Button */
    #sidebar-toggle-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9990;
      background: #CBD5E1;
      border: 1.5px solid #475569;
      border-radius: 9px;
      color: #0F172A;
      width: 34px;
      height: 34px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.12);
    }
    #sidebar-toggle-btn:hover {
      background: #BFDBFE;
      border-color: #1D4ED8;
      color: #1E3A8A;
    }

    /* Main Content Area */
    .main-container {
      flex: 1;
      min-width: 0;
      padding: 1.1rem 1.35rem 2.2rem 1.35rem;
    }

    /* Top Header Row */
    .top-header-row {
      display: grid;
      grid-template-columns: 150px 1fr 170px;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.55rem;
    }
    @media (max-width: 768px) {
      .top-header-row {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }
    .main-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1.0rem, 3.2vw, 1.68rem);
      font-weight: 800;
      color: #0F172A;
      text-align: center;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Buttons */
    .btn-primary {
      background: linear-gradient(180deg, #1E40AF 0%, #1E3A8A 100%);
      border: 1px solid #1E3A8A;
      border-radius: 10px;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.84rem;
      padding: 0.5rem 0.95rem;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(30, 58, 138, 0.22);
      transition: all 0.16s ease;
      text-align: center;
      width: 100%;
    }
    .btn-primary:hover {
      background: linear-gradient(180deg, #2563EB 0%, #1D4ED8 100%);
      transform: translateY(-1px);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Status Bar */
    .mi-status-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1.2rem;
      padding: 0.45rem 0.95rem;
      margin-bottom: 0.75rem;
      border-radius: 10px;
      background: #D5E0ED;
      border: 1px solid #94A3B8;
      font-size: 0.80rem;
      color: #0F172A;
    }
    .mi-status-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.14rem 0.65rem;
      border-radius: 999px;
      background: #1E3A8A;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.74rem;
    }

    /* 5-Column Cascading Filter Bar */
    .filter-grid-5 {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 0.65rem;
    }
    @media (max-width: 992px) {
      .filter-grid-5 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    .filter-card {
      border-radius: 11px;
      padding: 0.45rem 0.6rem;
      background: linear-gradient(145deg, #E8EFF7 0%, #DCE6F2 100%);
      border: 1px solid #94A3B8;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
    }
    .filter-card label {
      display: block;
      font-size: 0.74rem;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 4px;
    }
    .filter-select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 7px;
      border: 1px solid #64748B;
      background: #F1F5F9;
      color: #0F172A;
      font-weight: 700;
      font-size: 0.80rem;
      cursor: pointer;
    }

    /* Secondary Controls Row (View & Sort) */
    .sub-controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 0.65rem;
    }
    @media (max-width: 768px) {
      .sub-controls-row {
        grid-template-columns: 1fr;
      }
    }
    .inline-radio-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      padding: 0.45rem 0.75rem;
      border-radius: 10px;
      background: linear-gradient(145deg, #E8EFF7 0%, #DCE6F2 100%);
      border: 1px solid #94A3B8;
      font-size: 0.82rem;
      font-weight: 700;
      color: #0F172A;
    }
    .inline-radio-bar label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* 6-Column Pastel KPI Ribbon (Emojis Strictly Here) */
    .kpi-grid-6 {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 11px;
      margin-bottom: 12px;
    }
    @media (max-width: 1024px) {
      .kpi-grid-6 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    @media (max-width: 600px) {
      .kpi-grid-6 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    .kpi-card {
      border-radius: 12px;
      padding: 0.65rem 0.85rem;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.07);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .kpi-card:hover {
      transform: translateY(-2px);
    }
    .kpi-label {
      font-size: 0.74rem;
      font-weight: 800;
      color: #1E293B;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .kpi-val {
      font-size: 1.42rem;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.15;
    }
    .kpi-sub {
      font-size: 0.70rem;
      font-weight: 700;
      color: #334155;
      margin-top: 3px;
    }

    .kpi-sky {
      border: 1px solid #93C5FD;
      border-top: 4px solid #1D4ED8;
      background: linear-gradient(145deg, #DBEAFE 0%, #E0F2FE 100%);
    }
    .kpi-lavender {
      border: 1px solid #C4B5FD;
      border-top: 4px solid #6D28D9;
      background: linear-gradient(145deg, #EDE9FE 0%, #E0E7FF 100%);
    }
    .kpi-teal {
      border: 1px solid #67E8F9;
      border-top: 4px solid #0E7490;
      background: linear-gradient(145deg, #CFFAFE 0%, #E0F2FE 100%);
    }
    .kpi-rose {
      border: 1px solid #FCA5A5;
      border-top: 4px solid #B91C1C;
      background: linear-gradient(145deg, #FEE2E2 0%, #FECDD3 100%);
    }
    .kpi-amber {
      border: 1px solid #FCD34D;
      border-top: 4px solid #B45309;
      background: linear-gradient(145deg, #FEF3C7 0%, #FDE68A 100%);
    }
    .kpi-sage {
      border: 1px solid #6EE7B7;
      border-top: 4px solid #047857;
      background: linear-gradient(145deg, #D1FAE5 0%, #A7F3D0 100%);
    }
    .kpi-pink {
      border: 1px solid #F472B6;
      border-top: 4px solid #BE185D;
      background: linear-gradient(145deg, #FCE7F3 0%, #FBCFE8 100%);
    }

    /* Connected 6-Bucket Overdue Ageing Tree */
    .p1-age-card {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: linear-gradient(145deg, #FFE4E6 0%, #FECDD3 100%);
      border: 1px solid #FDA4AF;
      border-top: 3.5px solid #BE123C;
      border-radius: 10px;
      padding: 9px 11px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.07);
    }

    /* Section Header Banners */
    .exec-section-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem 1rem;
      padding: 0.6rem 1.05rem;
      margin-top: 0.5rem;
      margin-bottom: 0.65rem;
      border-radius: 10px;
      background: linear-gradient(90deg, #CFD9E6 0%, #DEE7F2 100%);
      border: 1px solid #94A3B8;
      border-left: 5px solid #1D4ED8;
    }
    .exec-section-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0F172A;
    }
    .exec-scope-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.22rem 0.75rem;
      border-radius: 999px;
      background: #DBEAFE;
      border: 1px solid #60A5FA;
      color: #1E3A8A;
    }

    /* Chart Box */
    .chart-box {
      border-radius: 12px;
      background: #E8EEF5;
      border: 1px solid #94A3B8;
      padding: 8px;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);
      margin-bottom: 1rem;
    }

    /* Tables */
    .ce-table-wrapper {
      max-height: 560px;
      overflow-y: auto;
      overflow-x: auto;
      border: 1px solid #94A3B8;
      border-radius: 12px;
      background: #E8EEF5;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      margin-top: 0.4rem;
      margin-bottom: 0.85rem;
    }
    table.ce-overdue-table {
